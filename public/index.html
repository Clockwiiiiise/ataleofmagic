<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>学院论坛 · 羊皮纸上的匿名角落</title>
  <link rel="icon" href="/images/logo.png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <!-- ==========================================================
       图片资源目录：public/images/
       ① bg.jpg      1920×1080 JPG ≤800KB   全站羊皮纸背景
       ② logo.png    256×256   PNG ≤200KB   站点 Logo
       ③ banner.jpg  1920×640  JPG ≤500KB   顶部黑金横幅
       ========================================================== -->

  <div class="bg-deco" aria-hidden="true">
    <img class="bg-photo" src="/images/bg.jpg" alt="" onerror="this.remove()" />
    <div class="bg-photo-overlay"></div>
    <div class="stars"></div>
  </div>

  <header class="site-header">
    <div class="container header-inner">
      <div class="logo">
        <span class="logo-mark"><img src="/images/logo.png" alt="logo" onerror="this.parentNode.textContent='📖'" /></span>
        <span class="logo-text">学院论坛<small>A TALE OF MAGIC</small></span>
      </div>
      <div class="user-box">
        <!-- 点击头像可上传自定义头像 -->
        <button class="avatar-btn" id="avatarBtn" type="button" title="点击更换头像">
          <span class="avatar" id="userAvatar">?</span>
          <span class="avatar-edit">✎</span>
        </button>
        <input id="avatarInput" type="file" accept="image/*" hidden />
        <input id="usernameInput" type="text" maxlength="24" placeholder="设置你的用户名…" />
        <span class="user-hint">评论时显示</span>
      </div>
    </div>
  </header>

  <main class="container">

    <!-- 英雄区：黑金横幅 + 新文案 -->
    <section class="hero">
      <img class="hero-img" src="/images/banner.jpg" alt="学院论坛" onerror="this.remove()" />
      <div class="hero-inner">
        <h1>在羊皮上写下心声</h1>
        <p>和同学们共享话题</p>
      </div>
    </section>

    <!-- 发帖区 -->
    <section class="card compose-card">
      <h2><span class="icon">✍️</span> 匿名发布新帖</h2>
      <form id="postForm">
        <input id="postTitle" type="text" maxlength="80" placeholder="标题（最多 80 字）" required />
        <textarea id="postContent" rows="4" maxlength="5000" placeholder="写下你想说的话，没有人知道你是谁…" required></textarea>

        <!-- 图片上传 -->
        <div class="uploader">
          <button type="button" class="btn btn-ghost" id="pickImages">📷 添加图片</button>
          <span class="upload-tip">最多 3 张，单张 8MB 内，自动压缩</span>
          <input id="postImages" type="file" accept="image/*" multiple hidden />
        </div>
        <div class="preview-grid" id="postPreview"></div>

        <div class="compose-footer">
          <span class="anony-badge">🕶️ 你的身份将完全保密</span>
          <button type="submit" class="btn btn-primary" id="publishBtn">发布</button>
        </div>
      </form>
    </section>

    <!-- 帖子列表 -->
    <section class="post-list" id="postList"></section>
    <p class="empty-tip" id="emptyTip" hidden>论坛还很安静，来做第一个发言的同学吧 ✨</p>
  </main>

  <footer class="site-footer">
    <p>📖 学院论坛 · 羊皮纸上的匿名角落</p>
  </footer>

  <!-- 图片放大查看 -->
  <div class="lightbox" id="lightbox" hidden>
    <img id="lightboxImg" src="" alt="查看大图" />
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
